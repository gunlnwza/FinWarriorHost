<!-- <header>

<!---------------------------------------------------------------------------->
<!-- VISIBLE -->
<!---------------------------------------------------------------------------->
<main>
<div class="table">
  <!-- DICE -->
  <div class="dice-zone">
    <div class="dice-scene" id="rollBtn" onclick="rollDice()">
      <div class="die" id="die">
        <img src="assets/dice/one.png" alt="">
      </div>
    </div>
  </div>
  
  <!-- DAILY ALERT DECK -->
  <div class="deck-zone">
    <div class="deck-menu">
      <button class="deck-menu-btn" onclick="toggleDeckMenu(this); event.stopPropagation()">···</button>
      <div class="deck-dropdown">
        <button onclick="openInspectModal('daily'); closeDeckMenus()">ดูไพ่</button>
        <button class="red" onclick="shuffleDeck('daily'); closeDeckMenus()">สับไพ่</button>
      </div>
    </div>
    <div class="deck-row">
      <div class="deck-stack" id="deckStack-daily" onclick="drawCard('daily')">
        <div class="card-back">
          <img src="assets/cards/daily_alert/back.png" alt="">
        </div>
      </div>
      <div class="card-slot" id="cardSlot-daily" onclick="returnCard('daily')">
        <div class="card-flip-inner" id="cardFlip-daily">
          <!-- <div class="card-back-face">
            <img src="assets/cards/daily_alert/back.png" alt="">
          </div> -->
          <div class="card-front-face daily-alert">
            <img id="cardRevealImg-daily" src="" alt="">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ECONOMICS EVENT DECK -->
  <div class="deck-zone">
    <div class="deck-menu">
      <button class="deck-menu-btn" onclick="toggleDeckMenu(this); event.stopPropagation()">···</button>
      <div class="deck-dropdown">
        <button onclick="openInspectModal('economics'); closeDeckMenus()">ดูไพ่</button>
        <button class="red" onclick="shuffleDeck('economics'); closeDeckMenus()">สับไพ่</button>
      </div>
    </div>
    <div class="deck-row">
      <div class="deck-stack" id="deckStack-economics" onclick="drawCard('economics')">
        <div class="card-back">
          <img src="assets/cards/economics_event/back.png" alt="">
        </div>
      </div>
      <div class="card-slot" id="cardSlot-economics" onclick="returnCard('economics')">
        <div class="card-flip-inner" id="cardFlip-economics">
          <!-- <div class="card-back-face">
            <img src="assets/cards/economics_event/back.png" alt="">
          </div> -->
          <div class="card-front-face economics-alert">
            <img id="cardRevealImg-economics" src="" alt="">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="economics-cycle-row">
  <div class="economics-cycle-box expansion">
    <p>Expansion</p>
    <p>ระยะฟื้นตัว</p>
    <div class="color-blob-row">
      <span class="color-blob" data-cell="0"></span>
      <span class="color-blob" data-cell="1"></span>
    </div>
  </div>

  <div class="economics-cycle-box peak">
    <p>Boom</p>
    <p>ระยะเฟื่องฟู</p>
    <div class="color-blob-row">
      <span class="color-blob" data-cell="2"></span>
      <span class="color-blob" data-cell="3"></span>
    </div>
  </div>

  <div class="economics-cycle-box recession">
    <p>Recession</p>
    <p>ระยะถดถอย</p>
    <div class="color-blob-row">
      <span class="color-blob" data-cell="4"></span>
      <span class="color-blob" data-cell="5"></span>
    </div>
  </div>

  <div class="economics-cycle-box trough">
    <p>Depression</p>
    <p>ระยะตกต่ำ</p>
    <div class="color-blob-row">
      <span class="color-blob" data-cell="6"></span>
      <span class="color-blob" data-cell="7"></span>
    </div>
  </div>
</div>
</main>

<!---------------------------------------------------------------------------->
<!-- BACKGROUND -->
<!---------------------------------------------------------------------------->
<!-- CARD MODAL -->
<div class="modal" id="cardModal">
  <div class="modal-backdrop" onclick="dismissCard()"></div>
  <div class="modal-content">
    <div class="card-modal-wrapper">
      <div class="card-flip-inner" id="cardFlipInner">
        <div class="card-back-face">
          <img src="assets/cards/daily_alert/back.png" alt="">
        </div>
        <div class="card-front-face">
          <img id="cardRevealImg" src="" alt="Card">
        </div>
      </div>
    </div>
    <div class="modal-hint">คลิกข้างนอกเพื่อสอดไพ่เข้าใต้กอง</div>
  </div>
</div>

<!-- INSPECT MODAL -->
<div class="modal" id="inspectModal">
  <div class="modal-backdrop" onclick="closeInspectModal()"></div>
  <div class="modal-content">
    <div class="inspect-modal-content">
      <div class="inspect-grid" id="inspectGrid"></div>
    </div>
    <div class="modal-hint">คลิกข้างนอกเพื่อออก</div>
  </div>
</div>

<script src="js/state.js"></script>
