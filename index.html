<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Host Controller</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!---------------------------------------------------------------------------->
<!-- VISIBLE -->
<!---------------------------------------------------------------------------->
<div class="table">

  <!-- CARD DECK -->
  <div class="card-zone">
    <!-- <span class="zone-label">Daily Alert</span> -->
    <div class="deck-stack" id="deckStack-daily" onclick="drawCard('daily')">
      <div class="card-back">
        <img src="assets/cards/daily_alert/back.png" alt="">
      </div>
    </div>
  </div>

  <!-- ECONOMICS EVENT DECK -->
  <div class="card-zone">
    <!-- <span class="zone-label">Economics Event</span> -->
    <div class="deck-stack" id="deckStack-economics" onclick="drawCard('economics')">
      <div class="card-back">
        <img src="assets/cards/economics_event/back.png" alt="">
      </div>
    </div>
  </div>

  <!-- DICE -->
  <div class="dice-zone">
    <div class="dice-scene" onclick="rollDice()">
      <div class="die" id="die">
        <img src="assets/dice/one.png" alt="">
      </div>
    </div>
    <button class="roll-btn" id="rollBtn" onclick="rollDice()">Roll</button>
  </div>

</div>

<!---------------------------------------------------------------------------->
<!-- BACKGROUND -->
<!---------------------------------------------------------------------------->
<!-- CARD MODAL -->
<div class="modal" id="cardModal">
  <div class="modal-backdrop" onclick="dismissCard()"></div>
  <div class="modal-content">
    <div class="card-modal-wrapper">
      <div class="card-flip-inner" id="cardFlipInner">
        <div class="card-back-face">
          <img src="assets/cards/daily_alert/back.png" alt="">
        </div>
        <div class="card-front-face">
          <img id="cardRevealImg" src="" alt="Card">
        </div>
      </div>
    </div>
    <div class="modal-hint">Click anywhere to return card to deck</div>
  </div>
</div>

<script src="deck.js"></script>
<script src="dice.js"></script>
<script src="script.js"></script>
</body>
</html>
