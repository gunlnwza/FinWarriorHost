<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Host Controller</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --felt: #1a3a2a;
    --felt-light: #1f4432;
    --felt-dark: #0f2218;
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --gold-dark: #8a6a1f;
    --cream: #f5ecd7;
    --shadow-deep: rgba(0,0,0,0.7);
    --shadow-card: rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--felt-dark);
    background-image:
      radial-gradient(ellipse at center, var(--felt-light) 0%, var(--felt-dark) 70%),
      url("data:image/svg+xml,%3Csvg width='4' height='4' viewBox='0 0 4 4' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 3L3 1' stroke='%23ffffff' stroke-width='0.3' stroke-opacity='0.04'/%3E%3C/svg%3E");
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Crimson Pro', serif;
    overflow: hidden;
    position: relative;
  }

  /* Vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 0;
  }

  h1 {
    font-family: 'Cinzel Decorative', serif;
    color: var(--gold);
    font-size: clamp(1rem, 2.5vw, 1.8rem);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 3rem;
    text-shadow: 0 0 30px rgba(201,168,76,0.4);
    position: relative;
    z-index: 1;
  }

  h1::before, h1::after {
    content: '✦';
    margin: 0 1rem;
    opacity: 0.6;
    font-size: 0.7em;
  }

  .table {
    display: flex;
    gap: clamp(3rem, 8vw, 8rem);
    align-items: center;
    position: relative;
    z-index: 1;
  }

  /* ── CARD DECK ── */
  .card-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  .zone-label {
    font-family: 'Cinzel Decorative', serif;
    color: var(--gold);
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.7;
  }

  .deck-stack {
    position: relative;
    width: 160px;
    height: 224px;
    cursor: pointer;
  }

  /* Stack shadow cards */
  .deck-stack::before,
  .deck-stack::after {
    content: '';
    position: absolute;
    border-radius: 10px;
    background: var(--gold-dark);
    border: 1px solid rgba(201,168,76,0.2);
  }
  .deck-stack::before {
    inset: 0;
    transform: translate(6px, 6px);
    opacity: 0.5;
  }
  .deck-stack::after {
    inset: 0;
    transform: translate(3px, 3px);
    opacity: 0.7;
  }

  .card-back {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background:
      linear-gradient(135deg, #1a0a00 0%, #2d1200 50%, #1a0a00 100%);
    border: 2px solid var(--gold);
    box-shadow:
      0 8px 32px var(--shadow-deep),
      inset 0 0 0 6px rgba(201,168,76,0.08),
      inset 0 0 0 7px rgba(201,168,76,0.15);
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    overflow: hidden;
  }

  .card-back::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 6px;
  }

  .card-back-pattern {
    width: 80px;
    height: 80px;
    opacity: 0.15;
    background-image: repeating-linear-gradient(
      45deg,
      var(--gold) 0, var(--gold) 1px,
      transparent 0, transparent 50%
    );
    background-size: 10px 10px;
    border-radius: 4px;
  }

  .deck-stack:hover .card-back {
    transform: translateY(-4px);
    box-shadow: 0 16px 48px var(--shadow-deep), 0 0 20px rgba(201,168,76,0.15);
  }

  .deck-stack:active .card-back { transform: translateY(-2px); }

  .deck-count {
    font-family: 'Cinzel Decorative', serif;
    color: var(--gold);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    opacity: 0.8;
  }

  /* ── DICE ── */
  .dice-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  .dice-scene {
    width: 140px;
    height: 140px;
    cursor: pointer;
  }

  .die {
    width: 100%;
    height: 100%;
    border-radius: 18px;
    background: #f8f0e0;
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow: 0 12px 32px rgba(0,0,0,0.5), inset 0 2px 6px rgba(255,255,255,0.4);
    overflow: hidden;
    display: grid;
    place-items: center;
    transition: transform 0.1s ease;
  }

  .die img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .pips {
    width: 100%;
    height: 100%;
    display: grid;
    padding: 18px;
  }

  /* quick shake + settle while "rolling" */
  .die.rolling { animation: diceShake 0.6s ease-in-out; }

  @keyframes diceShake {
    0%   { transform: rotate(0deg) scale(1); }
    15%  { transform: rotate(-12deg) scale(1.05); }
    30%  { transform: rotate(10deg) scale(0.97); }
    45%  { transform: rotate(-8deg) scale(1.04); }
    60%  { transform: rotate(6deg) scale(0.98); }
    75%  { transform: rotate(-4deg) scale(1.02); }
    100% { transform: rotate(0deg) scale(1); }
  }

  .pip {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #1a1a1a;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    justify-self: center;
    align-self: center;
  }

  /* Face transforms */
  .face-1 { transform: translateZ(70px); }
  .face-2 { transform: rotateY(90deg) translateZ(70px); }
  .face-3 { transform: rotateY(-90deg) translateZ(70px); }
  .face-4 { transform: rotateX(90deg) translateZ(70px); }
  .face-5 { transform: rotateX(-90deg) translateZ(70px); }
  .face-6 { transform: rotateY(180deg) translateZ(70px); }

  .roll-btn {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: var(--felt-dark);
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    border: none;
    padding: 0.6rem 1.8rem;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4), 0 0 0 1px var(--gold-dark);
    transition: transform 0.1s, box-shadow 0.1s;
  }

  .roll-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px var(--gold-dark); }
  .roll-btn:active { transform: translateY(0); }
  .roll-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* ── MODAL OVERLAY ── */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .modal.active {
    opacity: 1;
    pointer-events: all;
  }

  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.82);
    backdrop-filter: blur(6px);
  }

  .modal-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
  }

  /* ── CARD MODAL ── */
  .card-modal-wrapper {
    perspective: 1000px;
  }

  .card-flip-inner {
    width: min(60vw, 340px);
    height: min(84vw, 476px);
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .card-flip-inner.revealed {
    transform: rotateY(180deg);
  }

  .card-front-face, .card-back-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 0 1px var(--gold);
  }

  .card-back-face {
    background: linear-gradient(135deg, #1a0a00, #2d1200, #1a0a00);
    border: 2px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-back-face::before {
    content: '';
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 10px;
  }

  .card-front-face {
    transform: rotateY(180deg);
    background: #fff;
  }

  .card-front-face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Dismiss hint */
  .modal-hint {
    font-family: 'Crimson Pro', serif;
    font-style: italic;
    color: rgba(201,168,76,0.6);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }

  /* ── CARD RETURN ANIMATION ── */
  .flying-card {
    position: fixed;
    border-radius: 10px;
    background: linear-gradient(135deg, #1a0a00, #2d1200);
    border: 2px solid var(--gold);
    pointer-events: none;
    z-index: 200;
    transform-origin: center center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  }

  /* ── RESULT BADGE (dice) ── */
  .result-badge {
    font-family: 'Cinzel Decorative', serif;
    color: var(--gold);
    font-size: clamp(1.2rem, 4vw, 2rem);
    letter-spacing: 0.2em;
    text-shadow: 0 0 20px rgba(201,168,76,0.6);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease 0.8s, transform 0.4s ease 0.8s;
  }

  .result-badge.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* Upload helpers */
  .upload-zone {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 1rem;
    z-index: 10;
    flex-wrap: wrap;
    justify-content: center;
  }

  .upload-btn {
    font-family: 'Crimson Pro', serif;
    font-size: 0.75rem;
    color: rgba(201,168,76,0.7);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,168,76,0.2);
    padding: 0.4rem 1rem;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: all 0.2s;
  }

  .upload-btn:hover {
    background: rgba(201,168,76,0.1);
    color: var(--gold);
    border-color: rgba(201,168,76,0.5);
  }

  input[type=file] { display: none; }

  /* Divider line */
  .divider {
    width: 1px;
    height: 200px;
    background: linear-gradient(to bottom, transparent, rgba(201,168,76,0.3), transparent);
  }
</style>
</head>
<body>

<h1>Game Host</h1>

<div class="table">

  <!-- CARD DECK -->
  <div class="card-zone">
    <span class="zone-label">Card Deck</span>
    <div class="deck-stack" id="deckStack" onclick="drawCard()">
      <div class="card-back">
        <div class="card-back-pattern"></div>
      </div>
    </div>
    <div class="deck-count" id="deckCount">— cards</div>
  </div>

  <!-- CARD DECK -->
  <div class="card-zone">
    <span class="zone-label">Card Deck</span>
    <div class="deck-stack" id="deckStack" onclick="drawCard()">
      <div class="card-back">
        <div class="card-back-pattern"></div>
      </div>
    </div>
    <div class="deck-count" id="deckCount">— cards</div>
  </div>

  <div class="divider"></div>

  <!-- DICE -->
  <div class="dice-zone">
    <span class="zone-label">Dice</span>
    <div class="dice-scene" onclick="rollDice()">
      <div class="die" id="die">
        <!-- single visible face; pips swapped via JS, or replaced by img on load -->
        <div class="pips" id="pips" style="place-items:center"><div class="pip"></div></div>
      </div>
    </div>
    <button class="roll-btn" id="rollBtn" onclick="rollDice()">Roll</button>
    <div class="result-badge" id="resultBadge"></div>
  </div>

</div>

<!-- CARD MODAL -->
<div class="modal" id="cardModal">
  <div class="modal-backdrop" onclick="dismissCard()"></div>
  <div class="modal-content">
    <div class="card-modal-wrapper">
      <div class="card-flip-inner" id="cardFlipInner">
        <div class="card-back-face">
          <div class="card-back-pattern"></div>
        </div>
        <div class="card-front-face">
          <img id="cardRevealImg" src="" alt="Card">
        </div>
      </div>
    </div>
    <div class="modal-hint">Click anywhere to return card to deck</div>
  </div>
</div>


<!-- Upload controls -->
<div class="upload-zone">
  <label class="upload-btn" for="uploadCards">⊕ Load Card Images</label>
  <input type="file" id="uploadCards" accept="image/*" multiple onchange="loadCards(this)">

  <label class="upload-btn" for="uploadDice">⊕ Load Dice Face Images (6)</label>
  <input type="file" id="uploadDice" accept="image/*" multiple onchange="loadDice(this)">
</div>

<script>
// ── STATE ──
let deck = [];          // array of image src strings (data URLs)
let currentCardIdx = 0;
let isAnimating = false;

// ── CARD LOADING ──
function loadCards(input) {
  const files = Array.from(input.files);
  deck = [];
  let loaded = 0;
  files.forEach((file, i) => {
    const reader = new FileReader();
    reader.onload = e => {
      deck[i] = e.target.result;
      loaded++;
      if (loaded === files.length) {
        currentCardIdx = 0;
        updateDeckCount();
      }
    };
    reader.readAsDataURL(file);
  });
}

function updateDeckCount() {
  const remaining = deck.length - currentCardIdx;
  document.getElementById('deckCount').textContent =
    remaining > 0 ? `${remaining} card${remaining !== 1 ? 's' : ''} remaining` : 'Deck empty';
}

// ── DRAW CARD ──
function drawCard() {
  if (isAnimating) return;
  if (deck.length === 0) {
    // Demo mode: show placeholder
    openCardModal(null);
    return;
  }
  if (currentCardIdx >= deck.length) {
    document.getElementById('deckCount').textContent = 'Deck empty';
    return;
  }
  openCardModal(deck[currentCardIdx]);
  currentCardIdx++;
  updateDeckCount();
}

function openCardModal(src) {
  isAnimating = true;
  const modal = document.getElementById('cardModal');
  const flipInner = document.getElementById('cardFlipInner');
  const img = document.getElementById('cardRevealImg');

  if (src) img.src = src;
  else img.src = ''; // demo — show back only

  // Reset flip state
  flipInner.classList.remove('revealed');
  modal.classList.add('active');

  // Flip to front after brief pause
  setTimeout(() => {
    flipInner.classList.add('revealed');
    isAnimating = false;
  }, 300);
}

function dismissCard() {
  if (isAnimating) return;
  isAnimating = true;

  const modal = document.getElementById('cardModal');
  const flipInner = document.getElementById('cardFlipInner');
  const deckStack = document.getElementById('deckStack');

  // Flip back to card-back first
  flipInner.classList.remove('revealed');

  setTimeout(() => {
    // Get positions
    const cardRect = flipInner.getBoundingClientRect();
    const deckRect = deckStack.getBoundingClientRect();

    // Create flying card clone
    const flyCard = document.createElement('div');
    flyCard.className = 'flying-card';
    flyCard.style.cssText = `
      left: ${cardRect.left}px;
      top: ${cardRect.top}px;
      width: ${cardRect.width}px;
      height: ${cardRect.height}px;
    `;
    document.body.appendChild(flyCard);

    // Hide modal
    modal.classList.remove('active');

    // Animate flying card to deck
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        flyCard.style.transition = 'all 0.55s cubic-bezier(0.4, 0, 0.2, 1)';
        flyCard.style.left = `${deckRect.left}px`;
        flyCard.style.top = `${deckRect.top + deckRect.height}px`; // slides to bottom
        flyCard.style.width = `${deckRect.width}px`;
        flyCard.style.height = `${deckRect.height}px`;
        flyCard.style.opacity = '0';
        flyCard.style.transform = 'scale(0.85)';
      });
    });

    setTimeout(() => {
      flyCard.remove();
      isAnimating = false;
    }, 600);

  }, 400); // wait for flip-back
}

// ── DICE LOADING ──
// Load up to 6 face images; index 0 = face "1" ... index 5 = face "6"
let diceImages = []; // data URLs, optional

function loadDice(input) {
  const files = Array.from(input.files).slice(0, 6);
  diceImages = [];
  files.forEach((file, i) => {
    const reader = new FileReader();
    reader.onload = e => { diceImages[i] = e.target.result; };
    reader.readAsDataURL(file);
  });
}

// Pip layouts for the placeholder die (when no images loaded)
const pipLayouts = {
  1: '<div class="pips" style="place-items:center"><div class="pip"></div></div>',
  2: '<div class="pips" style="grid-template-columns:1fr 1fr;"><div class="pip" style="grid-column:2"></div><div class="pip" style="grid-column:1;align-self:end"></div></div>',
  3: '<div class="pips" style="grid-template-columns:1fr 1fr;"><div class="pip" style="grid-column:2"></div><div class="pip" style="place-self:center"></div><div class="pip" style="grid-column:1;align-self:end"></div></div>',
  4: '<div class="pips" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>',
  5: '<div class="pips" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;"><div class="pip"></div><div class="pip"></div><div class="pip" style="grid-column:1 / span 2;justify-self:center"></div><div class="pip"></div><div class="pip"></div></div>',
  6: '<div class="pips" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>',
};

function showFace(n) { // n = 1..6
  const die = document.getElementById('die');
  if (diceImages.length === 6) {
    die.innerHTML = `<img src="${diceImages[n - 1]}" alt="face ${n}">`;
  } else {
    die.innerHTML = pipLayouts[n];
  }
}

// ── ROLL DICE ──
function rollDice() {
  if (isAnimating) return;
  isAnimating = true;

  const die = document.getElementById('die');
  const btn = document.getElementById('rollBtn');
  const badge = document.getElementById('resultBadge');
  const result = Math.floor(Math.random() * 6) + 1; // 1..6

  badge.classList.remove('show');
  btn.disabled = true;

  // shuffle faces visually during the shake
  let ticks = 0;
  const cycle = setInterval(() => { showFace(Math.floor(Math.random() * 6) + 1); ticks++; }, 80);

  die.classList.remove('rolling');
  void die.offsetWidth; // reflow to restart animation
  die.classList.add('rolling');

  setTimeout(() => {
    clearInterval(cycle);
    die.classList.remove('rolling');
    showFace(result); // settle on final face

    badge.textContent = `${result}`;
    badge.classList.add('show');

    btn.disabled = false;
    isAnimating = false;
  }, 600);
}

// Init count
updateDeckCount();
</script>
</body>
</html>
