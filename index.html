<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Host Controller</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!---------------------------------------------------------------------------->
<!-- VISIBLE -->
<!---------------------------------------------------------------------------->
<h1>Game Host</h1>

<div class="table">

  <!-- CARD DECK -->
  <div class="card-zone">
    <span class="zone-label">Card Deck</span>
    <div class="deck-stack" id="deckStack" onclick="drawCard()">
      <div class="card-back">
        <div class="card-back-pattern"></div>
      </div>
    </div>
    <div class="deck-count" id="deckCount">— cards</div>
  </div>

  <!-- CARD DECK -->
  <!-- <div class="card-zone">
    <span class="zone-label">Card Deck</span>
    <div class="deck-stack" id="deckStack" onclick="drawCard()">
      <div class="card-back">
        <div class="card-back-pattern"></div>
      </div>
    </div>
    <div class="deck-count" id="deckCount">— cards</div>
  </div> -->

  <div class="divider"></div>

  <!-- DICE -->
  <div class="dice-zone">
    <span class="zone-label">Dice</span>
    <div class="dice-scene" onclick="rollDice()">
      <div class="die" id="die">
        <!-- single visible face; pips swapped via JS, or replaced by img on load -->
        <div class="pips" id="pips" style="place-items:center"><div class="pip"></div></div>
      </div>
    </div>
    <button class="roll-btn" id="rollBtn" onclick="rollDice()">Roll</button>
    <div class="result-badge" id="resultBadge"></div>
  </div>

</div>

<!---------------------------------------------------------------------------->
<!-- BACKGROUND -->
<!---------------------------------------------------------------------------->
<!-- CARD MODAL -->
<div class="modal" id="cardModal">
  <div class="modal-backdrop" onclick="dismissCard()"></div>
  <div class="modal-content">
    <div class="card-modal-wrapper">
      <div class="card-flip-inner" id="cardFlipInner">
        <div class="card-back-face">
          <div class="card-back-pattern"></div>
        </div>
        <div class="card-front-face">
          <img id="cardRevealImg" src="" alt="Card">
        </div>
      </div>
    </div>
    <div class="modal-hint">Click anywhere to return card to deck</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
